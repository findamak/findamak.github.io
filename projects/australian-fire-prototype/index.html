<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1716">
<title>Pathfire — Australian FIRE tracker prototype</title>
<style>
  :root { --ink:#10211f; --muted:#61706c; --line:#dce3df; --paper:#f6f8f5; --surface:#fff; --pine:#0c3b34; --teal:#007f72; --mint:#bfe5d9; --gold:#d89b31; --rose:#c94e53; --shadow:0 12px 34px rgba(20,48,42,.10); }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#e7ece9; color:var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button,input,select { font:inherit; }
  button { cursor:pointer; }
  .app { max-width:470px; min-height:100vh; margin:0 auto; background:var(--paper); position:relative; overflow:hidden; padding-bottom:90px; }
  header { padding:22px 21px 18px; background:var(--pine); color:#f7fbf8; }
  .eyebrow { font-size:11px; text-transform:uppercase; letter-spacing:.12em; opacity:.70; font-weight:750; }
  h1 { margin:5px 0 0; font-size:28px; letter-spacing:-.045em; line-height:1.05; }
  h2 { font-size:21px; letter-spacing:-.035em; margin:0 0 8px; }
  h3 { font-size:15px; margin:0; letter-spacing:-.015em; }
  p { margin:0; }
  .sub { font-size:13px; color:var(--muted); line-height:1.45; }
  .topline { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .avatar { width:34px; height:34px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.24); border-radius:50%; font-size:13px; font-weight:800; }
  main { padding:18px 16px 0; }
  .screen { display:none; animation:rise .2s ease-out; }
  .screen.active { display:block; }
  @keyframes rise { from {opacity:.2; transform:translateY(6px)} to {opacity:1; transform:none} }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; box-shadow:0 2px 7px rgba(15,30,25,.025); }
  .card.dark { background:var(--pine); border-color:var(--pine); color:white; }
  .hero-number { font-size:31px; letter-spacing:-.06em; font-weight:760; margin:4px 0; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .stack { display:grid; gap:10px; }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .metric-label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:750; }
  .dark .metric-label { color:#b6d4cd; }
  .metric-value { font-size:18px; font-weight:760; letter-spacing:-.035em; margin-top:3px; }
  .delta { color:var(--teal); font-size:12px; font-weight:700; }
  .pill { display:inline-flex; gap:5px; align-items:center; border-radius:99px; background:#e7f3ef; color:#176056; padding:5px 8px; font-size:11px; font-weight:750; }
  .pill.gold { background:#fbefd8; color:#8c5b0d; }
  .pill.rose { background:#fce9e8; color:#9c393e; }
  .progress { height:8px; background:#e6edeb; border-radius:99px; overflow:hidden; margin:10px 0 7px; }
  .progress > span { display:block; height:100%; border-radius:inherit; background:var(--teal); }
  .progress.gold > span { background:var(--gold); }
  .progress.rose > span { background:var(--rose); }
  .milestone { padding:14px 0; border-bottom:1px solid var(--line); }
  .milestone:last-child { border-bottom:0; padding-bottom:0; }
  .milestone:first-child { padding-top:3px; }
  .milestone .name { font-weight:760; font-size:15px; }
  .milestone .description { font-size:12px; color:var(--muted); margin-top:2px; line-height:1.35; }
  .milestone .date { font-size:13px; font-weight:730; color:var(--pine); text-align:right; }
  .section-title { margin:18px 4px 9px; font-size:13px; letter-spacing:.02em; font-weight:780; }
  .action { border:0; background:var(--teal); color:white; border-radius:13px; min-height:46px; padding:0 15px; font-weight:760; font-size:14px; box-shadow:0 5px 13px rgba(0,127,114,.18); }
  .action.secondary { background:#e7efeb; color:var(--pine); box-shadow:none; }
  .action.ghost { background:transparent; color:var(--teal); box-shadow:none; padding:0 4px; min-height:auto; }
  .action.full { width:100%; }
  .nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(470px,100%); background:rgba(255,255,255,.96); backdrop-filter:blur(12px); border-top:1px solid var(--line); height:76px; display:flex; justify-content:space-around; z-index:5; padding:7px 6px env(safe-area-inset-bottom); }
  .nav button { flex:1; border:0; background:transparent; color:#73817d; display:grid; place-items:center; gap:3px; font-size:10px; font-weight:680; }
  .nav .nav-icon { height:24px; font-size:19px; line-height:1; }
  .nav button.active { color:var(--teal); }
  .notice { padding:13px; border-radius:14px; background:#eef5f2; color:#24554d; font-size:13px; line-height:1.42; }
  .notice strong { color:#113d36; }
  .list-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 0; border-bottom:1px solid var(--line); }
  .list-item:last-child { border-bottom:0; }
  .item-name { font-size:14px; font-weight:720; }
  .item-meta { font-size:12px; color:var(--muted); margin-top:2px; }
  .item-value { font-size:14px; font-weight:760; text-align:right; }
  .item-value.negative { color:var(--rose); }
  .form-header { padding:1px 4px 14px; }
  label { display:block; font-size:12px; font-weight:720; color:#3e514d; margin:15px 0 6px; }
  input,select { width:100%; border:1px solid #cfd9d5; background:white; min-height:46px; border-radius:11px; padding:0 12px; color:var(--ink); outline:none; }
  input:focus,select:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,127,114,.12); }
  .input-prefix { position:relative; }
  .input-prefix span { position:absolute; left:13px; top:13px; color:var(--muted); font-weight:700; }
  .input-prefix input { padding-left:29px; }
  .check-row { display:flex; align-items:center; gap:11px; padding:12px 0; }
  .check-row input { width:20px; min-height:20px; accent-color:var(--teal); }
  .stepper { display:flex; gap:6px; margin:14px 0 18px; }
  .stepper span { height:5px; flex:1; background:#dbe4e0; border-radius:4px; }
  .stepper span.active { background:var(--teal); }
  .small { font-size:12px; color:var(--muted); line-height:1.45; }
  .scenario-select { display:flex; gap:8px; overflow:auto; padding:2px 0 11px; scrollbar-width:none; }
  .scenario-select button { white-space:nowrap; border:1px solid var(--line); background:white; color:var(--muted); border-radius:99px; padding:9px 12px; font-size:12px; font-weight:730; }
  .scenario-select button.active { color:white; background:var(--pine); border-color:var(--pine); }
  .chart { height:150px; position:relative; margin:8px 0 6px; padding:13px 0 20px; }
  .chart .grid { position:absolute; inset:10px 0 24px; background:repeating-linear-gradient(to bottom,transparent,transparent 33%,#e7ecea 34%); }
  .chart svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .chart-labels { position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-between; font-size:10px; color:var(--muted); }
  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(11,25,22,.42); z-index:20; padding:18px; align-items:flex-end; }
  .modal-backdrop.show { display:flex; }
  .sheet { width:min(470px,100%); margin:auto; max-height:88vh; overflow:auto; background:var(--paper); border-radius:22px 22px 14px 14px; padding:18px 16px 24px; box-shadow:var(--shadow); animation:up .2s ease; }
  @keyframes up { from{transform:translateY(20px);opacity:.4} to{transform:none;opacity:1} }
  .sheet-handle { width:38px; height:4px; background:#c4d0cb; border-radius:99px; margin:0 auto 16px; }
  .close { border:0; background:#e7efeb; color:var(--pine); width:34px; height:34px; border-radius:50%; font-size:18px; }
  .empty { border:1px dashed #b9cac3; border-radius:14px; padding:15px; text-align:center; font-size:13px; color:var(--muted); }
  .toast { position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:90px; background:#102c27; color:#fff; border-radius:12px; padding:11px 14px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:30; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .onboarding { min-height:100vh; background:var(--pine); padding:26px 20px 28px; color:#f7fbf8; display:none; }
  .onboarding.show { display:block; }
  .onboarding .brand { font-weight:800; letter-spacing:-.04em; font-size:22px; }
  .onboard-card { margin-top:32px; background:#f7faf8; color:var(--ink); border-radius:22px; padding:20px; }
  .onboarding .action.secondary { background:#dbece6; }
  @media (min-width:720px) { body { padding:20px; } .app { min-height:calc(100vh - 40px); border-radius:26px; box-shadow:var(--shadow); } .nav { bottom:20px; border-radius:0 0 26px 26px; } }
</style>
</head>
<body>
<div class="onboarding" id="onboarding">
  <div class="brand">Pathfire</div>
  <div class="eyebrow" style="margin-top:7px">Australian FIRE tracker</div>
  <div class="onboard-card" id="onboardCard"></div>
</div>

<div class="app" id="app">
  <header id="header">
    <div class="topline"><div><div class="eyebrow">Pathfire</div><h1 id="headerTitle">Your FIRE path</h1></div><button class="avatar" aria-label="Open plan settings" title="Plan settings" onclick="showScreen('settings')">⚙</button></div>
  </header>
  <main>
    <section class="screen active" id="dashboard"></section>
    <section class="screen" id="checkin"></section>
    <section class="screen" id="cashflow"></section>
    <section class="screen" id="plans"></section>
    <section class="screen" id="settings"></section>
  </main>
  <nav class="nav" aria-label="Primary navigation">
    <button class="active" data-screen="dashboard"><span class="nav-icon">⌂</span><span>Home</span></button>
    <button data-screen="checkin"><span class="nav-icon">＋</span><span>Check-in</span></button>
    <button data-screen="cashflow"><span class="nav-icon">≋</span><span>Cash flow</span></button>
    <button data-screen="plans"><span class="nav-icon">◫</span><span>Plans</span></button>
  </nav>
</div>
<div class="modal-backdrop" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const AUD = new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0});
const money = n => AUD.format(n || 0);
const shortMoney = n => n >= 1000000 ? '$'+(n/1000000).toFixed(n>=10000000?0:2)+'m' : n >=1000 ? '$'+Math.round(n/1000)+'k' : money(n);
const clamp = (n,min,max)=>Math.min(max,Math.max(min,n));
const defaultState = {
  started:true, activeScenario:'current',
  profile:{age:40, retirementAge:52, preservationAge:60, withdrawalRate:3.5, inflationRate:2.5, retirementSpend:85000},
  assets:[
    {id:'cash',name:'Cash & savings',type:'cash',balance:189000,annualReturn:3.5,fi:true,accessible:true},
    {id:'super',name:'Super',type:'superannuation',balance:271000,annualReturn:7.5,fi:true,accessible:false},
    {id:'etf',name:'ETFs',type:'investment',balance:80000,annualReturn:7,fi:true,accessible:true},
    {id:'shares',name:'Direct shares',type:'investment',balance:2581814,annualReturn:7,fi:true,accessible:true},
    {id:'ppor',name:'Primary residence',type:'primary_residence',balance:2062000,annualReturn:3.5,fi:false,accessible:false},
    {id:'ip1',name:'Investment property',type:'investment_property',balance:1632000,annualReturn:3.5,fi:false,accessible:false}
  ],
  debts:[
    {id:'mortgage',name:'PPOR loan',type:'loan',balance:1260000,annualInterestRate:6.0,linked:'ppor'},
    {id:'iploan',name:'Investment loan',type:'loan',balance:75000,annualInterestRate:6.5,linked:'ip1'},
    {id:'loc',name:'Line of credit',type:'other',balance:30000,annualInterestRate:7.0},
    {id:'otherloan',name:'Credit card debt',type:'credit_card',balance:250000,annualInterestRate:0}
  ],
  income:{Employment:17500,'Rental income':4100,'Distributions':1100},
  expenses:{Housing:4300,'Investment property':950,'Utilities & communications':760,'Food & household':2400,Transport:680,Health:580,'Family & education':1350,Lifestyle:1100,Other:380},
  history:[
    {label:'Feb',net:2930000,fi:2850000,spend:80100},{label:'Mar',net:2970000,fi:2895000,spend:81100},{label:'Apr',net:3015000,fi:2945000,spend:82300},{label:'May',net:3048000,fi:3005000,spend:83000},{label:'Jun',net:3090000,fi:3070000,spend:83700},{label:'Jul',net:3138814,fi:3121814,spend:84500}
  ],
  scenarios:{
    current:{name:'Current plan',spend:85000,flexIncome:0,workEndAge:52,accessibleExclude:0,note:'Keep current properties and loan structure.'},
    debtfree:{name:'Debt-free plan',spend:67000,flexIncome:0,workEndAge:52,accessibleExclude:0,note:'Mortgage and loan repayments no longer form part of lifestyle spending.'},
    barista:{name:'Part-time at 47',spend:85000,flexIncome:36000,workEndAge:47,accessibleExclude:0,note:'Flexible work funds part of annual living costs.'}
  }
};
let state = JSON.parse(localStorage.getItem('pathfirePrototype') || JSON.stringify(defaultState));
let checkStep = 1;
function normaliseAssetType(type){ return ['super','smsf'].includes(type) ? 'superannuation' : type; }
function defaultAnnualReturn(type){ return ({cash:3.5,investment:7,superannuation:7.5,primary_residence:3.5,investment_property:3.5,other:0})[normaliseAssetType(type)] ?? 0; }
function calculateRealReturn(annualReturn, inflationRate){ return ((1 + Number(annualReturn || 0) / 100) / (1 + Number(inflationRate || 0) / 100) - 1) * 100; }
function normaliseLiabilityType(type){ return ['ppor_loan','investment_property_loan','margin_loan','car_loan','personal_loan','smsf_loan'].includes(type) ? 'loan' : type; }
function defaultLiabilityType(name=''){
  const value=name.toLowerCase();
  if(value.includes('credit card')) return 'credit_card';
  if(value.includes('loan') || value.includes('mortgage') || value.includes('margin')) return 'loan';
  return 'other';
}
function suggestedAssetTypeForLiability(){ return ''; }
function linkableAssets(assets=state.assets){ return assets; }
function isUsualLiabilityAssetPair(liabilityType,assetType){ const suggested=suggestedAssetTypeForLiability(liabilityType); return !suggested || suggested===assetType; }
function normaliseState(){
  state.profile.inflationRate ??= 2.5;
  state.assets.forEach(asset => { asset.type=normaliseAssetType(asset.type); asset.annualReturn ??= defaultAnnualReturn(asset.type); });
  state.debts.forEach(debt => { debt.annualInterestRate ??= 0; if(debt.name==='Home loan') debt.name='PPOR loan'; if(debt.name==='Other loan') debt.name='Credit card debt'; debt.type=normaliseLiabilityType(debt.type ?? defaultLiabilityType(debt.name)); });
  state.history ??=[]; state.history.forEach(normaliseCheckinRecord);
}
function save(){ localStorage.setItem('pathfirePrototype',JSON.stringify(state)); }
function addExpenseCategory(name='New category'){
  const base=(name||'New category').trim() || 'New category'; let candidate=base, suffix=2;
  while(Object.hasOwn(state.expenses,candidate)) candidate=`${base} ${suffix++}`;
  state.expenses[candidate]=0; save(); return candidate;
}
function setExpenseCategory(previousName,nextName,amount){
  if(!Object.hasOwn(state.expenses,previousName)) return false;
  const name=(nextName||'').trim(); if(!name) return false;
  delete state.expenses[previousName]; state.expenses[name]=Math.max(0,Number(amount)||0); save(); return true;
}
function removeExpenseCategory(name){ if(!Object.hasOwn(state.expenses,name)) return false; delete state.expenses[name]; save(); return true; }
function removeAsset(id){
  const index=state.assets.findIndex(asset=>asset.id===id); if(index<0) return false;
  state.assets.splice(index,1); state.debts.forEach(debt=>{if(debt.linked===id) debt.linked='';}); save(); return true;
}
function removeLiability(id){ const index=state.debts.findIndex(debt=>debt.id===id); if(index<0) return false; state.debts.splice(index,1); save(); return true; }
const CHECKIN_MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function checkinPeriod({month,year}={},date=new Date()){
  const fallbackMonth=CHECKIN_MONTHS[date.getMonth()], fallbackYear=date.getFullYear();
  const legacyMonth=CHECKIN_MONTHS.find(item=>item.toLowerCase().startsWith(String(month||'').trim().toLowerCase().slice(0,3)));
  return {month:CHECKIN_MONTHS.includes(month)?month:(legacyMonth||fallbackMonth),year:Math.max(2000,Number(year)||fallbackYear)};
}
function checkinLabel(month,year){ return `${month} ${year}`; }
function checkinMetrics({assets=[],debts=[],income={},expenses={}}){
  const assetTotal=assets.reduce((total,asset)=>total+Math.max(0,Number(asset.balance)||0),0), debtTotal=debts.reduce((total,debt)=>total+Math.max(0,Number(debt.balance)||0),0);
  const fi=assets.filter(asset=>asset.fi).reduce((total,asset)=>total+Math.max(0,Number(asset.balance)||0),0);
  const annualSpending=(Object.values(expenses).reduce((total,value)=>total+Math.max(0,Number(value)||0),0)+debts.reduce((total,debt)=>total+Math.max(0,Number(debt.balance)||0)*Math.max(0,Number(debt.annualInterestRate)||0)/100/12,0))*12;
  const pporAssets=assets.filter(asset=>asset.type==='primary_residence'), pporAssetIds=new Set(pporAssets.map(asset=>asset.id)), ppor=pporAssets.reduce((total,asset)=>total+Math.max(0,Number(asset.balance)||0),0), pporDebt=debts.filter(debt=>pporAssetIds.has(debt.linked)).reduce((total,debt)=>total+Math.max(0,Number(debt.balance)||0),0);
  return {net:assetTotal-debtTotal,netExPpor:(assetTotal-ppor)-(debtTotal-pporDebt),fi,spend:annualSpending};
}
function checkinCashflowMetrics({assets=[],debts=[],income={},expenses={}}){
  const manualIncome=Object.values(income).reduce((total,value)=>total+Math.max(0,Number(value)||0),0);
  const cashInterest=assets.filter(asset=>asset.type==='cash'&&Number(asset.annualReturn)>0).reduce((total,asset)=>total+Math.max(0,Number(asset.balance)||0)*Number(asset.annualReturn)/100/12,0);
  const manualSpending=Object.values(expenses).reduce((total,value)=>total+Math.max(0,Number(value)||0),0);
  const liabilityInterest=debts.reduce((total,debt)=>total+Math.max(0,Number(debt.balance)||0)*Math.max(0,Number(debt.annualInterestRate)||0)/100/12,0);
  const incomeTotal=manualIncome+cashInterest, spending=manualSpending+liabilityInterest;
  return {income:incomeTotal,spending,surplus:incomeTotal-spending,manualIncome,cashInterest,manualSpending,liabilityInterest};
}
function makeCheckinSnapshot({month,year,note}={},source=state){
  const period=checkinPeriod({month,year}), assets=(source.assets||[]).map(asset=>({...asset})), debts=(source.debts||[]).map(debt=>({...debt})), income={...(source.income||{})}, expenses={...(source.expenses||{})}, metrics=checkinMetrics({assets,debts,income,expenses});
  return {month:period.month,year:period.year,label:checkinLabel(period.month,period.year),note:String(note??'').trim(),assets,debts,income,expenses,...metrics};
}
function sortCheckins(checkins){ return [...checkins].sort((left,right)=>{ const a=checkinPeriod(left), b=checkinPeriod(right); return b.year-a.year||CHECKIN_MONTHS.indexOf(b.month)-CHECKIN_MONTHS.indexOf(a.month); }); }
function checkinSnapshotForEditing(checkin,source=state){
  if(Array.isArray(checkin.assets)&&Array.isArray(checkin.debts)&&checkin.income&&checkin.expenses) return checkin;
  return makeCheckinSnapshot({month:checkin.month||checkin.label,year:checkin.year,note:checkin.note},source);
}
function normaliseCheckinRecord(checkin){
  const period=checkinPeriod({month:checkin.month||checkin.label,year:checkin.year}); checkin.month=period.month; checkin.year=period.year; checkin.label=checkinLabel(period.month,period.year); checkin.note ??='';
  if(Array.isArray(checkin.assets)&&Array.isArray(checkin.debts)&&checkin.income&&checkin.expenses) Object.assign(checkin,makeCheckinSnapshot(checkin,checkin));
  return checkin;
}
function deleteHistoricalCheckin(index){ if(index<0||index>=state.history.length) return false; const [deleted]=state.history.splice(index,1); save(); return deleted; }
function updateHistoricalCheckin(index,changes={}){
  const checkin=state.history[index]; if(!checkin) return false;
  const assets=changes.assets??checkin.assets, debts=changes.debts??checkin.debts, income=changes.income??checkin.income, expenses=changes.expenses??checkin.expenses;
  const hasSnapshot=Array.isArray(assets)&&Array.isArray(debts)&&income&&expenses;
  if(hasSnapshot){ Object.assign(checkin,makeCheckinSnapshot({month:changes.month??checkin.month,year:changes.year??checkin.year,note:changes.note??checkin.note},{assets,debts,income,expenses})); }
  else { const period=checkinPeriod({month:changes.month??changes.label??checkin.month??checkin.label,year:changes.year??checkin.year}); checkin.month=period.month; checkin.year=period.year; checkin.label=checkinLabel(period.month,period.year); checkin.net=Math.max(0,Number(changes.net??checkin.net)||0); checkin.fi=Math.max(0,Number(changes.fi??checkin.fi)||0); checkin.spend=Math.max(0,Number(changes.spend??checkin.spend)||0); checkin.note=String(changes.note??checkin.note??'').trim(); }
  save(); return checkin;
}
normaliseState();
function incomeLines(income=state.income){ return Object.entries(income).map(([name,monthly])=>({name,monthly:Number(monthly)||0})); }
function cashIncomeLines(assets=state.assets){ return assets.filter(asset=>asset.type==='cash'&&Number(asset.annualReturn)>0).map(asset=>({name:`Estimated interest — ${asset.name}`,monthly:Number(asset.balance||0)*Number(asset.annualReturn)/100/12})); }
function addIncomeSource(name='New income source'){
  const base=(name||'New income source').trim() || 'New income source'; let candidate=base, suffix=2;
  while(Object.hasOwn(state.income,candidate)) candidate=`${base} ${suffix++}`;
  state.income[candidate]=0; save(); return candidate;
}
function setIncomeSource(oldName,newName,monthly){
  if(!Object.hasOwn(state.income,oldName)) return false;
  const name=(newName||'').trim(); if(!name) return false;
  delete state.income[oldName]; state.income[name]=Math.max(0,Number(monthly)||0); save(); return true;
}
function removeIncomeSource(name){ if(!Object.hasOwn(state.income,name)) return false; delete state.income[name]; save(); return true; }
function calc(){
  const assets=state.assets.reduce((a,x)=>a+x.balance,0), debt=state.debts.reduce((a,x)=>a+x.balance,0);
  const primaryAssets=state.assets.filter(asset=>asset.type==='primary_residence'), primaryAssetIds=new Set(primaryAssets.map(asset=>asset.id));

function scenarioCalc(key=state.activeScenario){
  const c=calc(), p=state.profile, s=state.scenarios[key];

  const coast=rr > -1 ? full/Math.pow(1+rr,years) : full;
  const barista=Math.max(0,s.spend-s.flexIncome)/wr;
  const bridgeYears=Math.max(0,p.preservationAge-s.workEndAge);
  const bridge=Math.max(0,netSpend*bridgeYears);
  const monthlyContribution=Math.max(0,c.surplus);
  let portfolio=c.fi, months=0;
  while(portfolio<full && months<720){ portfolio=portfolio*Math.pow(1+rr,1/12)+monthlyContribution; months++; }
  const date=months<720?new Date(new Date().getFullYear(),new Date().getMonth()+months,1):null;
  return {...s,full,coast,barista,bridge,netSpend,years,monthlyContribution,realReturn:rr,projected:date ? date.toLocaleString('en-AU',{month:'short',year:'numeric'}) : 'Not reached', date};

e.</p></div><button class="action ghost" onclick="showScreen('settings');openAssetEditor()">Manage</button></div>${c.interestLines.map(line=>`<div class="list-item"><div><div class="item-name">${line.name}</div><div class="item-meta">Automatic cash-flow line item</div></div><div class="item-value negative">${money(line.monthly)}</div></div>`).join('')}<div class="row small"><span>Total liability interest</span><strong>${money(c.monthlyInterest)}/month</strong></div></div><div class="card"><h3>Observed vs retirement lifestyle</h3><div class="chart"><div class="grid"></div><svg viewBox="0 0 400 150" preserveAspectRatio="none"><polyline fill="none" stroke="#007f72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="0,118 80,102 160,84 240,65 320,47 400,32"/><line x1="0" y1="60" x2="400" y2="60" stroke="#d89b31" stroke-width="2" stroke-dasharray="6 6"/></svg><div class="chart-labels"><span>Feb</span><span>Apr</span><span>Jun</span><span>Jul</span></div></div><div class="row small"><span>Observed annual run-rate: <strong>${money(annual)}</strong></span><span>Plan: <strong>${money(target)}</strong></span></div></div><div class="section-title">Cash-flow history</div><p class="sub" style="margin-top:-8px">Saved monthly income, spending and surplus, newest first.</p>${cashflowHistoryRows()}`; }
function renderPlans(){ const c=calc(); const cards=Object.entries(state.scenarios).map(([k,s])=>{const x=scenarioCalc(k);return `<div class="card ${state.activeScenario===k?'dark':''}"><div class="row"><div><h3>${s.name}</h3><p class="${state.activeScenario===k?'small':'sub'}" style="margin-top:3px">${s.note}</p></div><button class="action ${state.activeScenario===k?'secondary':'ghost'}" onclick="state.activeScenario='${k}';save();renderAll()">${state.activeScenario===k?'Selected':'Use plan'}</button></div><div class="split" style="margin-top:15px"><div><div class="metric-label">Full FI target</div><div class="metric-value">${shortMoney(x.full)}</div></div><div><div class="metric-label">Projection</div><div class="metric-value">${x.projected}</div></div></div><div class="progress ${k==='debtfree'?'gold':''}"><span style="width:${clamp(c.fi/x.full*100,0,100)}%"></span></div><div class="row small"><span>${(c.fi/x.full*100).toFixed(0)}% funded</span><button class="action ghost" onclick="openScenarioEditor('${k}')">Edit assumptions</button></div></div>`}).join(''); document.getElementById('plans').innerHTML=`<div class="form-header"><h2>Plans</h2><p class="sub">Compare different futures against the same current snapshot.</p></div>${cards}<button class="action secondary full" onclick="addScenario()">+ Add a custom plan</button>`; }
function renderSettings(){ const c=calc(), p=state.profile; document.getElementById('settings').innerHTML=`<div class="form-header"><h2>Plan settings</h2><p class="sub">Shared assumptions. Asset returns are set individually under Assets & debts.</p></div><div class="card"><label>Current age</label><input type="number" id="age" value="${p.age}"><label>Intended Full FI age</label><input type="number" id="retirementAge" value="${p.retirementAge}"><label>Super preservation age</label><input type="number" id="preservationAge" value="${p.preservationAge}"><label>Withdrawal rate</label><div class="input-prefix"><input type="number" id="withdrawalRate" step="0.1" value="${p.withdrawalRate}"><span>%</span></div><label>Annual inflation rate</label><div class="input-prefix"><input type="number" id="inflationRate" step="0.1" value="${p.inflationRate}"><span>%</span></div><p class="small" style="margin-top:7px">Each asset’s annualised return is converted to a real return using this inflation rate. Your FI projection uses the balance-weighted real return of FI assets: <strong>${c.weightedRealReturn.toFixed(2)}%</strong>.</p><label>Annual retirement spending</label><div class="input-prefix"><span>$</span><input type="number" id="retirementSpend" value="${p.retirementSpend}"></div><button class="action full" style="margin-top:20px" onclick="saveSettings()">Save assumptions</button></div><div class="card"><div class="row"><div><h3>Assets & debts</h3><p class="sub">${state.assets.length} assets · ${state.debts.length} liabilities</p></div><button class="action ghost" onclick="openAssetEditor()">Manage</button></div><div class="list-item"><span class="item-name">Total assets</span><span class="item-value">${money(c.assets)}</span></div><div class="list-item"><span class="item-name">Total debt</span><span class="item-value negative">${money(c.debt)}</span></div></div><button class="action ghost" style="color:#9c393e" onclick="resetPrototype()">Reset demo data</button>`; }
function saveSettings(){ ['age','retirementAge','preservationAge','withdrawalRate','inflationRate','retirementSpend'].forEach(k=>state.profile[k]=Number(document.getElementById(k).value)||0);save();toast('Assumptions updated');renderAll(); }
function openModal(content){document.getElementById('sheet').innerHTML=`<div class="sheet-handle"></div>${content}`;document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function escapeHTML(value){ return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
function openExpenseEditor(){openModal(`<div class="row"><h2>Spending categories</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub">Add, rename, update or delete categories for the current month. Retirement spending remains a separate plan assumption.</p>${Object.entries(state.expenses).map(([name,value])=>`<div data-expense-row="${encodeURIComponent(name)}" class="card" style="padding:14px;margin:12px 0"><label>Category</label><input data-expense-name value="${escapeHTML(name)}"><label>Monthly amount</label><div class="input-prefix"><span>$</span><input type="number" data-expense-amount value="${value}"></div><button class="action ghost" style="color:#9c393e;margin-top:10px" onclick="deleteExpenseCategoryUI('${encodeURIComponent(name)}')">Delete category</button></div>`).join('')}<button class="action secondary full" style="margin-top:8px" onclick="addExpenseCategoryUI()">+ Add spending category</button><button class="action full" style="margin-top:12px" onclick="saveExpenseCategories()">Save spending</button>`);}
function addExpenseCategoryUI(){ addExpenseCategory(); openExpenseEditor(); }
function deleteExpenseCategoryUI(encodedName){ removeExpenseCategory(decodeURIComponent(encodedName)); openExpenseEditor(); }
function saveExpenseCategories(){
  const next={}; document.querySelectorAll('[data-expense-row]').forEach(row=>{
    const name=row.querySelector('[data-expense-name]').value.trim(); const amount=Math.max(0,Number(row.querySelector('[data-expense-amount]').value)||0);
    if(name) next[name]=(next[name]||0)+amount;
  });
  state.expenses=next; save(); closeModal(); renderAll(); toast('Cash flow updated');
}
function assetTypeOptions(selected){ return [['cash','Cash / savings'],['investment','ETF / shares'],['superannuation','Superannuation'],['primary_residence','Primary residence'],['investment_property','Investment property'],['other','Other asset']].map(([value,label])=>`<option value="${value}" ${selected===value?'selected':''}>${label}</option>`).join(''); }
function liabilityTypeOptions(selected){ return [['loan','Loan'],['credit_card','Credit card debt'],['other','Other liability']].map(([value,label])=>`<option value="${value}" ${selected===value?'selected':''}>${label}</option>`).join(''); }
function liabilityTypeLabel(type){ return ({loan:'Loan',credit_card:'Credit card debt',other:'Other liability'})[normaliseLiabilityType(type)] || 'Other liability'; }
function liabilityLinkOptions(liabilityType,selected=''){
  const suggestedType=suggestedAssetTypeForLiability(liabilityType), assets=linkableAssets();
  const ordered=[...assets.filter(asset=>asset.type===suggestedType),...assets.filter(asset=>asset.type!==suggestedType)];
  return `<option value="">Not linked to an asset</option>${ordered.map(asset=>`<option value="${asset.id}" ${selected===asset.id?'selected':''}>${asset.type===suggestedType?'Suggested — ':''}${escapeHTML(asset.name)} (${asset.type.replaceAll('_',' ')})</option>`).join('')}`;
}
function liabilityLinkGuidance(liabilityType,assetId=''){
  const suggestedType=suggestedAssetTypeForLiability(liabilityType), asset=linkableAssets().find(item=>item.id===assetId);
  if(normaliseLiabilityType(liabilityType)==='loan') return 'A loan can be associated with any asset if you want it to reduce that asset’s displayed equity.';
  if(!suggestedType) return 'This liability is normally left unlinked. Link it only if you want it to reduce a specific asset’s displayed equity.';
  const suggestion={primary_residence:'a primary residence',investment_property:'an investment property',investment:'an investment asset',other:'an associated asset',superannuation:'a superannuation asset'}[suggestedType];
  if(asset && !isUsualLiabilityAssetPair(liabilityType,asset.type)) return `This is an unusual pairing. ${liabilityTypeLabel(liabilityType)} normally suggests ${suggestion}; you can still keep this association if it reflects the real structure.`;
  return `${liabilityTypeLabel(liabilityType)} usually suggests ${suggestion}. Suggested assets appear first.`;
}
function updateLiabilityLinkSuggestions(){ const type=document.getElementById('debtType').value, linked=document.getElementById('debtLinked'); const selected=linked.value; linked.innerHTML=liabilityLinkOptions(type,selected); document.getElementById('debtLinkGuidance').textContent=liabilityLinkGuidance(type,linked.value); }
function linkablePropertyAssets(assets=state.assets){ return assets.filter(asset=>['primary_residence','investment_property'].includes(asset.type)); }
function openAssetEditor(){ const inflation=state.profile.inflationRate, equityById=Object.fromEntries(calc().assetEquity.map(asset=>[asset.id,asset])); openModal(`<div class="row"><h2>Assets & debts</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub">Add or edit balances, annualised returns and whether an asset forms part of your FI portfolio.</p><div class="section-title">Assets</div>${state.assets.map(a=>{const equity=equityById[a.id];return `<div class="list-item"><div><div class="item-name">${escapeHTML(a.name)}</div><div class="item-meta">${a.type.replaceAll('_',' ')} · ${Number(a.annualReturn).toFixed(1)}% annualised · ${calculateRealReturn(a.annualReturn,inflation).toFixed(1)}% real${equity.linkedDebt?` · Equity ${money(equity.equity)}`:''}</div></div><div><div class="item-value">${money(a.balance)}</div><button class="action ghost" onclick="openAssetForm('${a.id}')">Edit</button></div></div>`}).join('')}<button class="action secondary full" style="margin-top:12px" onclick="openAssetForm()">+ Add asset</button><div class="section-title">Liabilities</div>${state.debts.map(d=>`<div class="list-item"><div><div class="item-name">${escapeHTML(d.name)}</div><div class="item-meta">${liabilityTypeLabel(d.type)} · ${d.linked ? 'Associated with '+(state.assets.find(a=>a.id===d.linked)?.name || 'asset') : 'Not associated with an asset'}</div></div><div><div class="item-value negative">${money(d.balance)}</div><button class="action ghost" onclick="openLiabilityForm('${d.id}')">Edit</button></div></div>`).join('')}<button class="action secondary full" style="margin-top:12px" onclick="openLiabilityForm()">+ Add liability</button>`);}

function openAssetForm(id){ const a=id ? state.assets.find(asset=>asset.id===id) : {id:'',name:'',type:'investment',balance:0,annualReturn:7,fi:true,accessible:true}; openModal(`<div class="row"><h2>${id?'Edit asset':'Add asset'}</h2><button class="close" onclick="openAssetEditor()">×</button></div><label>Asset name</label><input id="assetName" value="${a.name}" placeholder="e.g. Australian shares"><label>Asset type</label><select id="assetType">${assetTypeOptions(a.type)}</select><label>Current balance</label><div class="input-prefix"><span>$</span><input id="assetBalance" type="number" value="${a.balance}"></div><label>Annualised return assumption</label><div class="input-prefix"><input id="assetReturn" type="number" step="0.1" value="${a.annualReturn}"><span>%</span></div><p class="small" style="margin-top:7px">With ${state.profile.inflationRate}% inflation, this is a <strong>${calculateRealReturn(a.annualReturn,state.profile.inflationRate).toFixed(2)}% real return</strong>.</p><div class="check-row"><input type="checkbox" id="assetFi" ${a.fi?'checked':''}><label for="assetFi" style="margin:0">Include in FI portfolio</label></div><div class="check-row"><input type="checkbox" id="assetAccessible" ${a.accessible?'checked':''}><label for="assetAccessible" style="margin:0">Accessible before super</label></div><button class="action full" style="margin-top:16px" onclick="saveAsset('${id||''}')">${id?'Save asset':'Add asset'}</button>${id?`<button class="action ghost full" style="color:#9c393e;margin-top:10px" onclick="deleteAssetUI('${id}')">Delete asset</button>`:''}`);}
function deleteAssetUI(id){ if(confirm('Delete this asset? Any linked liability will remain but no longer be linked.')){ removeAsset(id); openAssetEditor(); renderAll(); toast('Asset deleted'); } }
function saveAsset(id){ const type=document.getElementById('assetType').value; const asset={id:id||('asset'+Date.now()),name:document.getElementById('assetName').value.trim()||'Unnamed asset',type,balance:Math.max(0,Number(document.getElementById('assetBalance').value)||0),annualReturn:Number(document.getElementById('assetReturn').value)||0,fi:document.getElementById('assetFi').checked,accessible:document.getElementById('assetAccessible').checked}; if(id){ Object.assign(state.assets.find(a=>a.id===id),asset); } else { state.assets.push(asset); } save();openAssetEditor();renderAll();toast(id?'Asset updated':'Asset added');}
function openLiabilityForm(id){
  const d=id ? state.debts.find(debt=>debt.id===id) : {id:'',name:'',type:'loan',balance:0,annualInterestRate:0,linked:''};
  const annualInterest=d.balance*Number(d.annualInterestRate||0)/100;
  openModal(`<div class="row"><h2>${id?'Edit liability':'Add liability'}</h2><button class="close" onclick="openAssetEditor()">×</button></div>
    <label>Liability name</label><input id="debtName" value="${escapeHTML(d.name)}" placeholder="e.g. PPOR loan">
    <label>Liability type</label><select id="debtType" onchange="updateLiabilityLinkSuggestions()">${liabilityTypeOptions(d.type||defaultLiabilityType(d.name))}</select>
    <label>Amount owing</label><div class="input-prefix"><span>$</span><input id="debtBalance" type="number" value="${d.balance}"></div>
    <label>Annual interest rate</label><div class="input-prefix"><input id="debtInterestRate" type="number" step="0.01" value="${d.annualInterestRate}"><span>%</span></div>
    <p class="small" style="margin-top:7px">At the current balance and rate, the calculated interest expense is <strong>${money(annualInterest)}/year</strong> (${money(annualInterest/12)}/month). This is added automatically to Cash flow.</p>
    <label>Secured against / associated asset <span style="font-weight:400">(optional)</span></label>
    <p class="small" style="margin-top:4px">Use one optional association for the asset securing the liability or whose displayed equity it should reduce. It does <strong>not</strong> decide tax deductibility or the use of borrowed funds.</p>
    <select id="debtLinked" onchange="document.getElementById('debtLinkGuidance').textContent=liabilityLinkGuidance(document.getElementById('debtType').value,this.value)">${liabilityLinkOptions(d.type||defaultLiabilityType(d.name),d.linked)}</select>
    <p id="debtLinkGuidance" class="small" style="margin-top:7px">${liabilityLinkGuidance(d.type||defaultLiabilityType(d.name),d.linked)}</p>
    <div class="notice" style="margin-top:12px"><strong>Loan splits:</strong> If one facility funds different purposes or assets, create separate liability entries for each split. This prototype supports one associated asset per liability.</div>
    <button class="action full" style="margin-top:20px" onclick="saveLiability('${id||''}')">${id?'Save liability':'Add liability'}</button>${id?`<button class="action ghost full" style="color:#9c393e;margin-top:10px" onclick="deleteLiabilityUI('${id}')">Delete liability</button>`:''}`);
}
function deleteLiabilityUI(id){ if(confirm('Delete this liability? Its automatic interest cash-flow line will also be removed.')){ removeLiability(id); openAssetEditor(); renderAll(); toast('Liability deleted'); } }
function saveLiability(id){ const debt={id:id||('debt'+Date.now()),name:document.getElementById('debtName').value.trim()||'Unnamed liability',type:document.getElementById('debtType').value,balance:Math.max(0,Number(document.getElementById('debtBalance').value)||0),annualInterestRate:Math.max(0,Number(document.getElementById('debtInterestRate').value)||0),linked:document.getElementById('debtLinked').value}; if(id){ Object.assign(state.debts.find(d=>d.id===id),debt); } else { state.debts.push(debt); } save();openAssetEditor();renderAll();toast(id?'Liability updated':'Liability added');}
function openScenarioEditor(k){const s=state.scenarios[k];openModal(`<div class="row"><h2>${s.name}</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub">Scenario changes do not alter your monthly actuals.</p><label>Annual retirement spending</label><div class="input-prefix"><span>$</span><input id="sspend" type="number" value="${s.spend}"></div><label>Annual flexible-work income</label><div class="input-prefix"><span>$</span><input id="sflex" type="number" value="${s.flexIncome}"></div><label>Age to leave full-time work</label><input id="sage" type="number" value="${s.workEndAge}"><label>Scenario note</label><input id="snote" value="${s.note}"><button class="action full" style="margin-top:20px" onclick="saveScenario('${k}')">Save plan</button>`);}
function saveScenario(k){const s=state.scenarios[k];s.spend=Number(document.getElementById('sspend').value)||0;s.flexIncome=Number(document.getElementById('sflex').value)||0;s.workEndAge=Number(document.getElementById('sage').value)||0;s.note=document.getElementById('snote').value;save();closeModal();renderAll();toast('Plan updated');}
function addScenario(){ const id='custom'+Date.now();state.scenarios[id]={name:'Custom plan',spend:state.profile.retirementSpend,flexIncome:0,workEndAge:state.profile.retirementAge,note:'A new scenario to explore.'};state.activeScenario=id;save();renderAll();openScenarioEditor(id); }
function openCheckinIncomeAndSpending(){ openCurrentCheckin(2); }
function showScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));document.getElementById('headerTitle').textContent=({dashboard:'Your FIRE path',checkin:'Monthly check-in',cashflow:'Cash flow',plans:'Plans',settings:'Plan settings'})[id]||'Pathfire';window.scrollTo(0,0);}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function resetPrototype(){if(confirm('Reset all prototype data?')){state=JSON.parse(JSON.stringify(defaultState));save();renderAll();toast('Demo reset');}}
function renderAll(){renderDashboard();renderCheckin();renderCashflow();renderPlans();renderSettings();}
function renderOnboarding(step=1){const h=document.getElementById('onboardCard');if(step===1)h.innerHTML=`<div class="eyebrow" style="color:#5a706a">Step 1 of 3</div><h1 style="color:#10211f;margin-top:8px">A living FIRE plan, not another spreadsheet.</h1><p class="sub" style="margin-top:12px">Pathfire helps Australian households separate accessible investments, super, debt and future scenarios.</p><button class="action full" style="margin-top:26px" onclick="renderOnboarding(2)">Start my plan</button>`;else if(step===2)h.innerHTML=`<div class="eyebrow" style="color:#5a706a">Step 2 of 3</div><h2 style="margin-top:8px">Set the foundations</h2><label>Current age</label><input id="obAge" type="number" value="40"><label>Age you would like full work to become optional</label><input id="obRetire" type="number" value="52"><label>Annual retirement spending</label><div class="input-prefix"><span>$</span><input id="obSpend" type="number" value="85000"></div><button class="action full" style="margin-top:22px" onclick="state.profile.age=+document.getElementById('obAge').value;state.profile.retirementAge=+document.getElementById('obRetire').value;state.profile.retirementSpend=+document.getElementById('obSpend').value;renderOnboarding(3)">Continue</button>`;else h.innerHTML=`<div class="eyebrow" style="color:#5a706a">Step 3 of 3</div><h2 style="margin-top:8px">Start with a monthly snapshot</h2><p class="sub">You will enter cash, investments, super and debts once. Then Pathfire pre-fills them each month.</p><div class="notice" style="margin-top:18px"><strong>This prototype includes illustrative demo data.</strong> You can replace it in Plan settings after entering.</div><button class="action full" style="margin-top:22px" onclick="state.started=true;save();document.getElementById('onboarding').classList.remove('show');document.getElementById('app').style.display='block';renderAll()">Open the demo</button>`;}
function boot(){if(!state.started){document.getElementById('app').style.display='none';document.getElementById('onboarding').classList.add('show');renderOnboarding();}else renderAll();document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showScreen(b.dataset.screen)));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});}
boot();
</script>
</body>
</html>
